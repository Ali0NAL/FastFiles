[package]
name = "fastfiles"
version = "1.3.1"
description = "Aynı ağdaki bilgisayarlar arasında hızlı ve güvenli dosya transferi"
authors = ["Twinup"]
edition = "2021"
default-run = "fastfiles"

[lib]
name = "fastfiles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
ring = "0.17"
base64 = "0.22"
hex = "0.4"
walkdir = "2"
# Dosya bütünlüğü doğrulaması (aktarım sırasında akış halinde hesaplanır).
blake3 = "1"
# Sıkıştırılabilir dosyalarda blok blok sıkıştırma (metin, log, CSV, kaynak kod...).
zstd = "0.13"
# "Panoyu gönder": metin, ekran görüntüsü ve kopyalanan dosyalar.
arboard = "3"
png = "0.18"

[target.'cfg(windows)'.dependencies]
# Bildirime tıklanınca uygulamayı açabilmek için (notification eklentisi tıklamayı bildirmiyor).
tauri-winrt-notification = "0.8.1"
# Gezgin sağ tık menüsü ("FastFiles ile gönder") için kullanıcı kayıt defteri (HKCU).
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
