# macOS kurulum dosyası (.dmg) üretir. Hem Apple Silicon (M1/M2/M3...) hem Intel Mac'te çalışan
# tek bir "universal" paket çıkar. Derlenen dosya, çalıştırmanın sayfasında "Artifacts" altında.
#
# Elle başlatmak için: GitHub → Actions → "macOS derlemesi" → Run workflow.
name: macOS derlemesi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - '.github/workflows/macos.yml'

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cargo önbelleği
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Tauri CLI kur
        run: cargo install tauri-cli --version "^2" --locked

      # Tauri, paketlerken projedeki tüm programları universal klasöründe arar ama yalnızca ana
      # programı birleştirir; yayın aracı ff-release'i burada iki mimari için derleyip birleştiriyoruz.
      - name: Yardımcı aracı derle (ff-release, universal)
        working-directory: src-tauri
        run: |
          cargo build --release --bin ff-release --target aarch64-apple-darwin
          cargo build --release --bin ff-release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/ff-release \
            target/aarch64-apple-darwin/release/ff-release \
            target/x86_64-apple-darwin/release/ff-release

      - name: Derle (universal .dmg)
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo tauri build --target universal-apple-darwin --bundles app,dmg 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Loglar yalnızca giriş yapınca görünür; hata özeti çalıştırma sayfasında herkese görünsün.
      - name: Hata özetini göster
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          msg="$(grep -nE 'error(\[E[0-9]+\])?:|^error|Error:|failed to' "$log" | head -30; echo '-----'; tail -50 "$log")"
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Derleme hatası::$msg"

      - name: Sürümü oku
        id: ver
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Kurulum dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: FastFiles_${{ steps.ver.outputs.version }}_macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
